<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>웹 벤치마크 - CPU / 메모리 / GPU 개선 테스트</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 40px; position: relative; overflow-x: hidden; }
    button { padding: 10px 20px; font-size: 1.1rem; margin: 5px; cursor: pointer; }
    #result { white-space: pre-line; font-size: 1.2rem; margin-top: 20px; }
    #totalScore { font-size: 2rem; font-weight: bold; color: #e91e63; margin-top: 20px; display: none; }
    .progress-container {
      width: 80%; height: 20px; background: #ddd; border-radius: 10px; margin: 20px auto 5px;
      display: none;
    }
    .progress-bar {
      height: 100%; width: 0%; background: #4caf50; border-radius: 10px;
      transition: width 0.1s ease;
    }
    #progressText {
      font-size: 1rem;
      margin-bottom: 20px;
      display: none;
    }
    .firework {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
      z-index: 1000;
    }
    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>웹 벤치마크: CPU / 메모리 / GPU 테스트</h1>

  <button id="cpuBtn">🧠 CPU 테스트</button>
  <button id="memBtn">🧠 메모리 테스트</button>
  <button id="gpuBtn">🎮 GPU 테스트</button>

  <div id="result">결과가 여기에 표시됩니다.</div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div id="progressText">진행률: 0%</div>
  <div id="totalScore"></div>

  <script>
    const resultDiv = document.getElementById("result");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const totalScoreEl = document.getElementById("totalScore");

    let cpuResult = null;
    let memResult = null;
    let gpuResult = null;

    function updateResult() {
      let text = '';
      if (cpuResult) text += `🧠 CPU 처리 시간: ${cpuResult} ms\n`;
      if (memResult) text += `🧠 메모리 작업 시간: ${memResult} ms\n`;
      if (gpuResult) text += `🎮 GPU 프레임 속도: ${gpuResult} FPS\n`;

      resultDiv.textContent = text;

      if (cpuResult && memResult && gpuResult) {
        // 총점: CPU, 메모리는 빠를수록 낮은 ms, GPU는 FPS이므로 높을수록 좋음
        // 점수로 환산할때 GPU FPS를 10000/FPS 로 반비례 환산해서 CPU,메모리 ms랑 균형 맞춤
        const total = (10000 / cpuResult) + (10000 / memResult) + gpuResult;
        const score = total.toFixed(2);
        totalScoreEl.textContent = `🎉 총점: ${score}`;
        totalScoreEl.style.display = "block";
        launchFireworks();
      }
    }

    function showProgress(duration, callback) {
      progressContainer.style.display = "block";
      progressText.style.display = "block";
      progressBar.style.width = "0%";
      progressText.textContent = "진행률: 0%";

      let elapsed = 0;
      const intervalTime = 50;

      const interval = setInterval(() => {
        elapsed += intervalTime;
        let percent = Math.min((elapsed / duration) * 100, 100);
        progressBar.style.width = percent + "%";
        progressText.textContent = `진행률: ${Math.round(percent)}%`;

        if (elapsed >= duration) {
          clearInterval(interval);
          progressContainer.style.display = "none";
          progressText.style.display = "none";
          callback();
        }
      }, intervalTime);
    }

    document.getElementById("cpuBtn").onclick = () => {
      resultDiv.textContent = "CPU 테스트 중...";
      totalScoreEl.style.display = "none";
      const start = performance.now();
      showProgress(2000, () => {
        let x = 0;
        for (let i = 0; i < 2e8; i++) {
          x += Math.sqrt(i) * Math.sin(i) * Math.log(i + 1);
        }
        const end = performance.now();
        cpuResult = (end - start).toFixed(2);
        updateResult();
      });
    };

    document.getElementById("memBtn").onclick = () => {
      resultDiv.textContent = "메모리 테스트 중...";
      totalScoreEl.style.display = "none";
      // 메모리 읽기/쓰기 반복 작업 시간 측정 (실제 부하 반영)
      const size = 20 * 1024 * 1024; // 2천만 개 배열 요소 (메모리 적당히 큰 값)
      showProgress(2000, () => {
        try {
          const arr = new Array(size);
          const start = performance.now();
          for (let repeat = 0; repeat < 5; repeat++) {
            // 쓰기
            for (let i = 0; i < size; i += 1000) {
              arr[i] = Math.random();
            }
            // 읽기
            let sum = 0;
            for (let i = 0; i < size; i += 1000) {
              sum += arr[i];
            }
          }
          const end = performance.now();
          memResult = (end - start).toFixed(2);
          updateResult();
        } catch (e) {
          memResult = "오류";
          updateResult();
        }
      });
    };

    document.getElementById("gpuBtn").onclick = () => {
      resultDiv.textContent = "GPU 테스트 중...";
      totalScoreEl.style.display = "none";

      // GPU는 3초간 requestAnimationFrame 프레임 수 세기
      let frames = 0;
      const duration = 3000;
      const start = performance.now();

      function frameLoop() {
        frames++;
        const now = performance.now();
        if (now - start < duration) {
          requestAnimationFrame(frameLoop);
        } else {
          const fps = frames / ((now - start) / 1000);
          gpuResult = fps.toFixed(2);
          updateResult();
        }
      }
      showProgress(duration, () => {
        frameLoop();
      });
    };

    function launchFireworks() {
      for (let i = 0; i < 30; i++) {
        const dot = document.createElement("div");
        dot.className = "firework";
        dot.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
        dot.style.left = `${Math.random() * window.innerWidth}px`;
        dot.style.top = `${Math.random() * window.innerHeight * 0.5}px`;
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 1000);
      }
    }
  </script>
</body>
</html>
