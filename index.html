<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>고부하 웹 벤치마크</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 40px; }
    button { padding: 10px 20px; font-size: 1.1rem; margin: 5px; cursor: pointer; }
    #result { white-space: pre-line; font-size: 1.2rem; margin-top: 20px; }
    canvas { border: 1px solid #aaa; margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <h1>고부하 웹 벤치마크</h1>

  <button id="cpuBtn">CPU 고부하 벤치마크 실행</button>
  <button id="memBtn">메모리 고부하 벤치마크 실행</button>
  <button id="gfxBtn">그래픽 고부하 벤치마크 실행</button>

  <div id="result">결과가 여기에 표시됩니다.</div>
  <canvas id="gfxCanvas" width="600" height="300" style="display:none;"></canvas>

  <script>
    const cpuBtn = document.getElementById('cpuBtn');
    const memBtn = document.getElementById('memBtn');
    const gfxBtn = document.getElementById('gfxBtn');
    const resultDiv = document.getElementById('result');
    const canvas = document.getElementById('gfxCanvas');
    const ctx = canvas.getContext('2d');

    let cpuResult = null;
    let memResult = null;
    let gfxResult = null;

    function updateResult() {
      let text = '';

      if(cpuResult){
        text += `CPU 점수: ${cpuResult.score} (실행시간: ${cpuResult.duration.toFixed(2)} ms)\n`;
      }
      if(memResult){
        if(memResult.success){
          text += `메모리 테스트: 성공 (소요시간: ${memResult.duration.toFixed(2)} ms)\n`;
        } else {
          text += `메모리 테스트: 실패 (메모리 부족 등)\n`;
        }
      }
      if(gfxResult){
        text += `그래픽 FPS: ${gfxResult.fps}\n`;
      }

      if(cpuResult && memResult && gfxResult){
        const memScore = memResult.success ? (10000 / memResult.duration) : 0;
        const gfxScore = gfxResult.fps * 10;
        const totalScore = Number(cpuResult.score) + memScore + gfxScore;
        text += `\n🎉 총 합산 점수: ${totalScore.toFixed(2)} 🎉`;
      }

      resultDiv.textContent = text || '벤치마크 결과가 없습니다.';
    }

    // CPU 고부하 벤치마크
    function cpuBenchmark() {
      const iterations = 200000000; // 2억 반복 (고부하)
      let count = 0;
      const startTime = performance.now();
      for (let i = 0; i < iterations; i++) {
        count += Math.sqrt(i) * Math.sin(i) * Math.log(i + 1);
      }
      const endTime = performance.now();
      const duration = endTime - startTime;
      const score = (200000 / duration).toFixed(2);
      cpuResult = { duration, score };
      updateResult();
      cpuBtn.disabled = false;
    }

    // 메모리 고부하 벤치마크
    function memoryBenchmark() {
      // 100MB 배열 생성 시도 (모바일 환경 대비 조절 가능)
      const size = /Mobi|Android/i.test(navigator.userAgent) ? 20 * 1024 * 1024 : 100 * 1024 * 1024;
      const startTime = performance.now();
      try {
        const arr = new Array(size);
        for (let i = 0; i < size; i += 500) {
          arr[i] = i * Math.random();
        }
      } catch(e) {
        memResult = { duration: null, success: false };
        updateResult();
        memBtn.disabled = false;
        return;
      }
      const endTime = performance.now();
      const duration = endTime - startTime;
      memResult = { duration, success: true };
      updateResult();
      memBtn.disabled = false;
    }

    // 그래픽 고부하 벤치마크 (더 복잡한 애니메이션, 200프레임)
    function graphicsBenchmark(userRefreshRate = 60) {
      canvas.style.display = 'block';
      const startTime = performance.now();
      let frames = 0;
      const maxFrames = 200;

      function finishGraphicsBenchmark(frames, duration, userRefreshRate = 60) {
        const rawFps = frames / (duration / 1000);
        let correctedFps = rawFps;
        if(rawFps >= userRefreshRate * 0.95) {
          correctedFps = rawFps * 0.9;
        }
        return correctedFps.toFixed(1);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < 100; i++) {
          ctx.fillStyle = `hsl(${(frames*3 + i*7) % 360}, 70%, 50%)`;
          ctx.beginPath();
          ctx.arc(30 + i*6, 150 + 50*Math.sin(frames*0.07 + i), 20, 0, Math.PI*2);
          ctx.fill();
        }
        frames++;
        if(frames < maxFrames) {
          requestAnimationFrame(draw);
        } else {
          const endTime = performance.now();
          const duration = endTime - startTime;
          const correctedFps = finishGraphicsBenchmark(frames, duration, userRefreshRate);
          gfxResult = { fps: correctedFps };
          updateResult();
          gfxBtn.disabled = false;
          canvas.style.display = 'none';
        }
      }
      draw();
    }

    cpuBtn.addEventListener('click', () => {
      cpuBtn.disabled = true;
      resultDiv.textContent = 'CPU 고부하 벤치마크 진행 중... 오래 걸릴 수 있습니다.';
      setTimeout(cpuBenchmark, 100);
    });

    memBtn.addEventListener('click', () => {
      memBtn.disabled = true;
      resultDiv.textContent = '메모리 고부하 벤치마크 진행 중... 오래 걸릴 수 있습니다.';
      setTimeout(memoryBenchmark, 100);
    });

    gfxBtn.addEventListener('click', () => {
      gfxBtn.disabled = true;
      resultDiv.textContent = '그래픽 고부하 벤치마크 진행 중... 오래 걸릴 수 있습니다.';
      setTimeout(() => graphicsBenchmark(60), 100);
    });
  </script>
</body>
</html>
