<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>웹 벤치마크 - CPU 테스트</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 40px; position: relative; overflow-x: hidden; }
    button { padding: 10px 20px; font-size: 1.1rem; margin: 5px; cursor: pointer; }
    #deviceInfo { font-size: 1rem; margin-bottom: 10px; color: #555; white-space: pre-line; }
    #result { font-size: 1.2rem; margin-top: 10px; white-space: pre-line; }
    #totalScore { font-size: 2rem; font-weight: bold; color: #e91e63; margin-top: 20px; display: none; }
    .progress-container {
      width: 80%; height: 20px; background: #ddd; border-radius: 10px; margin: 20px auto 5px;
      display: none;
    }
    .progress-bar {
      height: 100%; width: 0%; background: #4caf50; border-radius: 10px;
      transition: width 0.1s ease;
    }
    #progressText {
      font-size: 1rem;
      margin-bottom: 20px;
      display: none;
    }
    .firework {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
      z-index: 1000;
    }
    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>웹 벤치마크: CPU 테스트</h1>

  <button id="cpuBtn">🧠 CPU 테스트</button>

  <div id="deviceInfo">기기 정보를 불러오는 중...</div>
  <div id="result">결과가 여기에 표시됩니다.</div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div id="progressText">진행률: 0%</div>
  <div id="totalScore"></div>

  <script>
    const deviceInfoEl = document.getElementById("deviceInfo");
    const resultDiv = document.getElementById("result");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const totalScoreEl = document.getElementById("totalScore");

    let cpuResult = null;

    function getMaxDeviceInfo() {
      const ua = navigator.userAgent;

      let os = "알 수 없음";
      let osVersion = "";

      if (/Windows NT 10.0/.test(ua)) { 
        os = "Windows 10/11"; 
      }
      else if (/Windows NT 6.3/.test(ua)) { os = "Windows 8.1"; }
      else if (/Windows NT 6.2/.test(ua)) { os = "Windows 8"; }
      else if (/Windows NT 6.1/.test(ua)) { os = "Windows 7"; }
      else if (/Mac OS X (\d+[_\.]\d+)/.test(ua)) {
        os = "Mac OS X";
        osVersion = ua.match(/Mac OS X (\d+[_\.]\d+)/)[1].replace("_", ".");
      }
      else if (/Android (\d+(\.\d+)?)/.test(ua)) {
        os = "Android";
        osVersion = ua.match(/Android (\d+(\.\d+)?)/)[1];
      }
      else if (/iPhone OS (\d+[_\d]*)/.test(ua)) {
        os = "iOS";
        osVersion = ua.match(/iPhone OS (\d+[_\d]*)/)[1].replace(/_/g, ".");
      }
      else if (/iPad; CPU OS (\d+[_\d]*)/.test(ua)) {
        os = "iPadOS";
        osVersion = ua.match(/iPad; CPU OS (\d+[_\d]*)/)[1].replace(/_/g, ".");
      }

      let device = "알 수 없음";
      if (/iPhone/.test(ua)) device = "아이폰";
      else if (/iPad/.test(ua)) device = "아이패드";
      else if (/Pixel/.test(ua)) device = "구글 픽셀";
      else if (/Samsung/.test(ua)) device = "삼성 기기";
      else if (/Macintosh/.test(ua)) device = "Mac";
      else if (/Windows/.test(ua)) device = "PC";

      let browser = "알 수 없음";
      let browserVersion = "";
      if (/Chrome\/(\d+)/.test(ua)) {
        browser = "Chrome";
        browserVersion = ua.match(/Chrome\/(\d+)/)[1];
      }
      else if (/Firefox\/(\d+)/.test(ua)) {
        browser = "Firefox";
        browserVersion = ua.match(/Firefox\/(\d+)/)[1];
      }
      else if (/Safari\/(\d+)/.test(ua) && !/Chrome\/(\d+)/.test(ua)) {
        browser = "Safari";
        browserVersion = ua.match(/Version\/(\d+)/)?.[1] || "";
      }
      else if (/Edg\/(\d+)/.test(ua)) {
        browser = "Edge";
        browserVersion = ua.match(/Edg\/(\d+)/)[1];
      }

      return `운영체제: ${os} ${osVersion}\n기기: ${device}\n브라우저: ${browser} ${browserVersion}`;
    }

    function updateResult() {
      if (cpuResult) {
        deviceInfoEl.textContent = getMaxDeviceInfo();
        resultDiv.textContent = `🧠 CPU 처리 시간: ${cpuResult} ms`;
        const scaledScore = Math.round((10000 / cpuResult) * 583);
        totalScoreEl.textContent = `🎉 총점: ${scaledScore}`;
        totalScoreEl.style.display = "block";
        launchFireworks();
      }
    }

    function showProgress(duration, callback) {
      progressContainer.style.display = "block";
      progressText.style.display = "block";
      progressBar.style.width = "0%";
      progressText.textContent = "진행률: 0%";

      let elapsed = 0;
      const intervalTime = 50;

      const interval = setInterval(() => {
        elapsed += intervalTime;
        let percent = Math.min((elapsed / duration) * 100, 100);
        progressBar.style.width = percent + "%";
        progressText.textContent = `진행률: ${Math.round(percent)}%`;

        if (elapsed >= duration) {
          clearInterval(interval);
          progressContainer.style.display = "none";
          progressText.style.display = "none";
          callback();
        }
      }, intervalTime);
    }

    document.getElementById("cpuBtn").onclick = () => {
      resultDiv.textContent = "CPU 테스트 중...";
      totalScoreEl.style.display = "none";
      deviceInfoEl.textContent = getMaxDeviceInfo();
      const start = performance.now();
      showProgress(2000, () => {
        let x = 0;
        for (let i = 0; i < 2e8; i++) {
          x += Math.sqrt(i) * Math.sin(i) * Math.log(i + 1);
        }
        const end = performance.now();
        cpuResult = (end - start).toFixed(2);
        updateResult();
      });
    };

    function launchFireworks() {
      for (let i = 0; i < 30; i++) {
        const dot = document.createElement("div");
        dot.className = "firework";
        dot.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
        dot.style.left = `${Math.random() * window.innerWidth}px`;
        dot.style.top = `${Math.random() * window.innerHeight * 0.5}px`;
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 1000);
      }
    }

    deviceInfoEl.textContent = getMaxDeviceInfo();
  </script>
</body>
</html>
