<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정원의 웹사이트</title>
  <style>
    body {
      background-color: #121212;  /* 다크 기본 */
      color: #f5f5f5;
      font-family: sans-serif;
      text-align: center;
      transition: background-color 0.5s, color 0.5s;
    }
    h1 {
      color: lightblue;
    }
    img {
      width: 200px;
      border-radius: 20px;
    }
    #date, #time {
      font-size: 1.5rem;
      margin-top: 20px;
    }
    /* 라이트모드일 때 전환되는 스타일 */
    .light-mode {
      background-color: #f0f8ff;
      color: #000;
    }
    .light-mode h1 {
      color: royalblue;
    }
    .mode-button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>정원의 첫 웹사이트</h1>
  <p>이건 나의 첫 번째 문단입니다.</p>
  <p>링크도 넣어볼게요 → <a href="https://www.google.com" target="_blank">구글 열기</a></p>
  <img src="https://via.placeholder.com/150" alt="예시 이미지">

  <h2 id="date"></h2>
  <h2 id="time"></h2>

  <!-- 모드 전환 버튼 -->
  <button id="modeToggle" class="mode-button">☀️ 라이트모드로 보기</button>

  <script>
    function updateDateTime() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('ko-KR');
      const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false });
      document.getElementById('date').textContent = `📅 오늘 날짜: ${dateStr}`;
      document.getElementById('time').textContent = `🕒 현재 시간: ${timeStr}`;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    // 다크모드 → 라이트모드 전환 버튼
    const btn = document.getElementById('modeToggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');

      if (document.body.classList.contains('light-mode')) {
        btn.textContent = '🌙 다크모드로 보기';
      } else {
        btn.textContent = '☀️ 라이트모드로 보기';
      }
    });
  </script>
</body>
</html>
